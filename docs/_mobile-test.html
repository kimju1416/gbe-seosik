<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 확인용</title>
<style>
  body{margin:0;background:#334155;font-family:sans-serif;display:flex;gap:20px;padding:16px;align-items:flex-start}
  .dev{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .lbl{color:#fff;font-size:12px;padding:4px 0;text-align:center}
  iframe{border:0;display:block}
</style>
</head>
<body>
  <div>
    <div class="lbl">375 x 780 (아이폰)</div>
    <div class="dev"><iframe data-w="375" width="375" height="780"></iframe></div>
  </div>
  <div>
    <div class="lbl">412 x 780 (안드로이드)</div>
    <div class="dev"><iframe data-w="412" width="412" height="780"></iframe></div>
  </div>
  <div>
    <div class="lbl">768 x 780 (태블릿)</div>
    <div class="dev"><iframe data-w="768" width="768" height="780"></iframe></div>
  </div>
<script>
  // 캐시를 피해 항상 최신 화면을 불러온다
  const t = Date.now();
  document.querySelectorAll('iframe').forEach(f => { f.src = 'index.html?m=' + t; });
</script>
</body>
</html>
